[general]
;IME 修复方案，只有0和1两种，优先尝试方案1（更完美），如果会卡门再尝试方案0
imeType=1
;分辨率 (推荐值: 1280x720, 1366x768; 其他可选: 1600x900, 1920x1080, 1024x768; 不保证可用: 800x600)
width=1280
height=720
;服务器地址
ServerIP_Address=127.0.0.1
serverIP_Port=8484
;加载文字汉化
SwitchChinese=true
;右下角消息数量
MsgAmount=10
;does your UI.wz include the MapleEzorsiaV2wzfiles.img? (true/false, default true if using UI.wz provided in setup guide)
EzorsiaV2WzIncluded=true
;is a resolution specific login frame being used in UI.wz? (true/false, default true if EzorsiaV2WzIncluded=true)
;somewhat obselete, mostly kept for ppl who wanna use their own login frame by directly editing the original frame in wz
CustomLoginFrame=true
;开启后登录界面的UI会按大边框布局，请确保UI使用了大边框才开启
bigLoginFrame=true
;窗口模式
WindowedMode=true
;跳过开头的动画
RemoveLogos=true
;Should VirtuProtect be enabled? (true/false, default true) (this is necessary for clients without CRC bypass such as hendi's clients
;that havent been editted further, can be turned off for clients with CRC bypass to save whatever processing power it uses)
UseVirtuProtect=true

[optional]
;物理攻击 面板上限
setDamageCap=199999
;魔攻/魔防 面板上限
setMAtkCap=1999
;命中上限
setAccCap=999
;回避上限
setAvdCap=999
;真实输出上限
setAtkOutCap=199999
;移速上限
speedMovementCap=140
;跳跃上限
jumpCap=123
;爬绳速度自适应：true=随移动速度变化；false=固定值
climbSpeedAuto=false
;爬绳基础速度系数
climbSpeed=1.0
;一种超级机制，不开启的话，升级属性点/技能点会停顿1秒，宠物捡取时攻击会停下来
useTubi=true
;did you wz edit UI/Login.img/Common/frame to something else and are using it?(true/false, default false)
ownLoginFrame=false
;did you wz edit the cashshop backgrnd(s) to something else and are using it?(true/false, default false)
ownCashShopFrame=false
; 允许重复发言相同内容
talkRepeat=false
; 连续说话限制 (毫秒)
talkTime=2000
; 修复"个别怪物无法被施加异常状态(冰冻/眩晕/爆炸箭晕眩)"：补上 CMob 状态闩锁 mob+0x528 的初始化
; 该字段客户端构造函数未写、内存池又复用不零化 ⇒ 非 0 时一切"影响移动"的状态包会被压进队列而永不施加
; 只补这一句初始化，不改动门控/队列/Doom 逻辑，也不修改 BeiDou.exe
fixMobLatch=true

; ===== Boss 血条显示（UI/UIWindow.img/MobGage）=====
; 旧的显示方式：血条左侧头像下方显示血量百分比（客户端 tooltip，自带半透明黑底）
bossHpPercent=true
; 血条内左侧显示当前血量、血条下方显示 Boss 名字（白字黑描边，直接画在血条上，无黑底）
bossHpText=true
; 上面的文本里是否带 Boss 名字（false = 只显示血量）
bossHpTextShowName=true

; ===== 任务灯泡（自动接任务的提示图标，Effect/BasicEff.img/QuestAlert）=====
; 客户端原本把这个灯泡挂在角色头上、跟着角色跑，很挡视线。
; 开启后把它改成挂在"屏幕坐标系"下（与官方怀旧服的处理方式一致），位置固定不动。
questBulbFixed=true
; 固定位置：questBulbX = 距屏幕左边像素；questBulbY = 距屏幕顶部像素（填负数 = 垂直居中）
; 就是屏幕像素本身，改完重启客户端即可，不用重编译
questBulbX=10
questBulbY=-1

; Buff icon countdown, official-client style: a number in the bottom-left corner of each buff icon.
;   buffTimerMaxMinutes or more left -> no number (default 10 min; 0 lifts the cap back to 1 hour)
;   1 minute or more      -> green, whole minutes rounded up (9:30 left reads 10)
;   under 1 minute        -> yellow, whole seconds rounded up
; buffTimerSize / *Color build the label's own fonts, because the client's FONT_TYPE table is 9/11/12/
; 15 px only and its one 15 px slot is white while its only green is the dark 0xFF28C99B. Colours are
; 0xRRGGBB (alpha is always opaque). Set buffTimerSize=-1 to ignore them and use the table slots:
;   7 = green 0xFF28C99B, 3 = yellow 0xFFFFFF20, 1 = black (outline), 13/52 = darker greens, 9 = orange.
; buffTimerX / buffTimerY place the number inside the 32x32 icon canvas (bottom-left corner).
buffTimer=true
buffTimerMaxMinutes=10
buffTimerSize=14
buffTimerMinuteColor=0x5AFFAA
buffTimerSecondColor=0xFFFF20
buffTimerOutlineColor=0x000000
buffTimerMinuteFont=7
buffTimerSecondFont=3
buffTimerOutlineFont=1
buffTimerX=4
buffTimerY=17

; ===== 斗气集中（三转）的斗气球贴图 =====
; 原版客户端给 10 个球位算贴图下标时用的是 (i+1)/2（整数除法），相邻两个球位撞同一张图，
; 所以斗气集中的 5 个球只会出现 3 种图案（state/1,1,2,2,3），看着像"有重复"。
; 开启后改为"一个球位一张图"：球位 1~5 读 state/1~5（斗气集中），球位 6~10 读 state/1~5（进阶斗气）。
; 只改客户端这一处下标计算：不动 wz、不动服务端；关掉即恢复原版观感。
comboOrbDistinct=true

; ===== 退出游戏时闪退：建角装备名列表窗口读到空槽列表 =====
; 建角界面那个列出 9 个装备槽当前物品名的窗口，重绘时读"槽候选列表"的数据指针并 +4 当字符串用
; （CLogin+0x244 男 / +0x268 女，由 +0x234 的性别开关选择）。该指针在列表未建好或已清空时是 0，
; 于是去读地址 0x00000004 ⇒ 0xC0000005（取证链见 Ursa-Server 的 docs/bugs/023）。
; 类内另一个消费者 ShiftNewCharEquip 判了空、绘制路径没判；开启后只在插件里补这一句判空：
; 空槽位那一行显示为空白，指针有效时原样交给客户端。
; 不改 exe、不改 wz、不改建角数据面；置 false 即恢复原版行为（退出时可复现原崩溃）。
fixNewCharEquipNull=true

; ===== 背包默认展平（全部分页一次显示）=====
; 客户端自带这个模式：Item 窗口右下角的按钮会把窗口换成 UI/UIWindow.img/Item/fullbackgrnd 的宽窗
; （5 个分页并排、583 宽、不建滚动条），状态存在 CUIItem+604h，构造时由 CConfig::GetInventoryExpanded
; 决定。但按钮写下的那个注册表值活不过一次正常退出——CConfig::SaveCharacter 会枚举 GameOption 键的
; 全部值、逐个删除后再写回它自己那份选项表（goWhisper/goQuickType/QuestAlarm_opened… 都在表里，
; InventoryExpanded 不在），所以每次开客户端都退回硬编码缺省值 0（窄窗+滚动条）。
; 开启后只改这一个缺省值字节（0x0049F604 的 push 0 → push 1）：
;   · 背包一打开就是展平，按钮照旧可用（本次会话内点成滚动条就一直滚动条，重开客户端又展平）；
;   · 注册表里若真存着值，仍然以存着的为准；
;   · 关掉即恢复原版默认（窄窗+滚动条）。
; 不改 exe / wz / 服务端；逆向记录见 docs/客户端逆向-背包默认展平.md
itemWndExpanded=true

; 让上面那个切换在退出后仍然作数（客户端自己的 bug：保存角色设置时会把这个键整个擦掉再写回它自己那份
; 选项表，InventoryExpanded 不在表里，所以玩家点什么都会在退出时丢掉）。
; 开启后挂钩 CConfig::SaveCharacter：进入时先把玩家的选择读下来，放行原函数（它照旧擦+写回），再把这个值
; 写回去。开启后："没表过态 → 看 itemWndExpanded"，"表过态 → 长期按玩家的选择"。
; 置 false 即回到原版行为（每次启动都按缺省值来，玩家的切换只在本次会话内有效）。
itemWndRemember=true

; ===== 宠物装备窗的自动续增益格（buff 技能）=====
; 宠物装备窗第二排有 4 格：前两格是拾取袋 / 吸金磁铁，后两格客户端的矩形表里没有登记
; （sub_8011FA 在那里返回 0、点击穿透）。本模块把后两格用作 buff 技能格，按宠物页签各一套
; （3 页签 × 2 格 = 6 位）。从技能窗把 buff 技能拖到那两格即被接受，只认 buff 技能
; （白名单与服务端同源生成，见 PetBuffWhitelist.h）；红蓝药那两格与第一排的药水包装备不动。
; 六个格子由服务端持久化（自定义报文 0x1001，登录时下发，见 docs/client/003 §5.11）。
; 置 false 即恢复原版（后两格无任何反应）。
petBuff=true
; 两格底上那两行「自动/技能」用的字体：自己按字号+颜色建（客户端的 FONT_TYPE 表只有 9/11/12/15
; 号，且这几个字号下没有深色）。字号 = 点阵像素高，颜色是 0xRRGGBB（不透明）；居中会跟着字号算。
; 想让插件改回用 FONT_TYPE 表里的现成字体，把 petSkillSlotFontSize 设成 0 或负数（那时才看下面的
; petSkillSlotFont）。默认 11 号深绿（0x006400，比格子底色的绿深一档）。
petSkillSlotFontSize=11
petSkillSlotFontColor=0x006400
; petSkillSlotFontSize <= 0 时用的 FONT_TYPE 兜底槽：43..49=9 号（白/黑/红/橙/米），34、36=11 号，
; 35=15 号，其余=12 号。
petSkillSlotFont=43
; 自动续增益：格子里的 buff 技能到期时由插件自己补一次。施放是静默的——直接组客户端自己的
; 0x5B 包发出去，不走 DoActiveSkill / SendSkillUseRequest，所以不占施法/攻击动作；别人视角里
; 仍能看到你挂了 buff（服务端只把特效广播给别人）。服务端无需改动，等级/冷却/蓝量门都在服务端。
; 置 false 即只保留"放技能进格子"的配置功能。
petAutoBuff=true
; 提前量（毫秒）：剩余时间少于它就补一次。默认 3000（3 秒）。
petAutoBuffLead=3000
; 扫描间隔（毫秒，钳到 100~5000）：多久检查一次六个格子。默认 1000（1 秒）——提前量 3 秒足够，
; 且单格另有 2 秒退避窗口兜底，实际发包不会比它更密。
petAutoBuffTickMs=1000
; 开=插件在每次 GIVE_BUFF / CANCEL_BUFF 处理期间保住另一方（重发同一 buff 时仍按客户端原生规则替换旧表项，
; 不留副本）；关=回到客户端原生行为。耐性本身不在这里算——客户端受击路径拿到的是 element=0，改由服务端结算
; （详见 Ursa-Server docs/client/004）。

;mob vacuum (MobVac.cpp): Ctrl+0 pulls every non-boss mob the client knows about onto the point you
;were standing on when you pressed it (the point does not follow you afterwards, so mobs that spawn
;later join it too). Press Ctrl+0 again to stop; the state is also dropped on death / map change /
;relogin.
;v83 的怪物位移由控制它的那个客户端说了算：插件在客户端自己的每帧更新**之前**把怪的向量控制器放到
;落点（走客户端自己的 CVecCtrlMob::SetActive，同时绑落脚点、重建移动路径）——放在之后只能骗过画面，
;攻击/被攻击判定与服务端上报读的都是更新内的坐标。同时搬动控制器那份「服务端已认可的坐标」缓存，
;不搬它客户端下一次位移决策会把怪基准化回旧点、上报的也一直是旧坐标。之后客户端用自己的
;MOVE_LIFE(0xBC) 把新坐标报给服务端 ⇒ 服务端不需要任何改动。服务端没把控制权给你的怪不会同步
;（它的上报会被服务端按 controller 身份丢弃）。BOSS 不吸。
mobVac=false

[debug]
debug=false
;免密模式，解除客户端密码限制（须先开启debug）
noPassword=false
